name: mig_rf
description: mig.rf - Migrant Assistant App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP
  dio: ^5.3.3
  retrofit: ^4.0.3

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.1

  # Navigation
  go_router: ^12.0.0

  # UI
  qr_flutter: ^4.1.0
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.0.0

  # Utils
  intl: ^0.18.1
  jwt_decode: ^0.3.1
  local_auth: ^2.1.7
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
