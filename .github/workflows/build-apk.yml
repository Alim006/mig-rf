name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --debug --no-pub
        continue-on-error: true

      - name: Find APK files
        run: find /home/runner/work -name "*.apk" -type f 2>/dev/null || echo "No APK found"
        working-directory: /

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mig-rf-debug-apk
          path: frontend/android/app/build/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
